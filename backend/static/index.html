<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电商 AIGC 工作台（本地工作台 + 云端推理）· 最小验收页</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--fg:#e6e9ef;--muted:#98a2b3;--acc:#5b8cff;--ok:#3fb950;--warn:#d29922;--err:#f85149}
  *{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header b{font-size:15px}
  .chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  main{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;padding:16px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea,button{width:100%;background:#0c0e13;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px}
  textarea{min-height:64px;resize:vertical}
  button{background:var(--acc);border:0;color:#fff;font-weight:600;cursor:pointer;margin-top:12px}
  button.ghost{background:#1f2430;border:1px solid var(--line);color:var(--fg)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.mono,span.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
  .s-succeeded{color:var(--ok);border-color:var(--ok)}.s-failed,.s-interrupted{color:var(--err);border-color:var(--err)}
  .s-running,.s-loading,.s-postprocess{color:var(--warn);border-color:var(--warn)}.s-canceled{color:var(--muted)}
  .preview img,.preview video{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line)}
  .preview{min-height:180px;margin:12px 0 20px;padding:14px;background:#0c0e13;border:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere}
  .preview a{color:#9ab7ff;display:inline-block;margin-top:8px}
  .preview button{width:auto;margin:8px 0 0}
  .table-scroll{overflow:auto;max-height:440px}.task-error{max-width:320px;overflow-wrap:anywhere;color:var(--err);margin-top:5px}
  .hint{color:var(--muted);font-size:11px;margin-top:6px}
  .err{color:var(--err);font-size:12px;margin-top:8px;white-space:pre-wrap}
  @media(max-width:860px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <b>电商 AIGC 本地工作台</b>
  <span class="chip" id="h-health">服务状态…</span>
  <span class="chip" id="h-mem">内存…</span>
  <span class="chip" id="h-model">已加载模型：无</span>
  <span class="chip" style="color:#d29922;border-color:#d29922">本地工作台 + 云端推理（火山方舟）</span>
</header>

<main>
  <section class="card">
    <div style="font-weight:600">新建任务</div>
    <label>类型</label>
    <select id="kind"><option value="image">图片</option><option value="video">视频（I2V）</option></select>

    <label>上传商品图（视频必填）</label>
    <input type="file" id="file" accept="image/*">
    <div class="hint" id="asset-hint">未上传</div>

    <label>模型</label>
    <select id="model"></select>
    <div class="hint" id="model-hint" role="status">正在检查本地模型…</div>

    <label>提示词</label>
    <textarea id="prompt" placeholder="例如：白色背景的护肤品主图，柔光，高级感，留出左上角文案位">白色背景的护肤品主图，柔和棚拍光，高级质感，留白构图</textarea>

    <div class="row">
      <div><label>宽（≤640 稳定；768 实测不可用）</label><input id="width" type="number" value="512" max="640"></div>
      <div><label>高</label><input id="height" type="number" value="512" max="640"></div>
    </div>
    <div class="row">
      <div><label>步数</label><input id="steps" type="number" value="25"></div>
      <div><label>种子（-1 随机）</label><input id="seed" type="number" value="-1"></div>
    </div>
    <div class="row" id="video-opts" style="display:none">
      <div><label>帧数</label><input id="frames" type="number" value="8"></div>
      <div><label>帧率</label><input id="fps" type="number" value="8"></div>
    </div>

    <button id="submit">提交任务</button>
    <button id="save-draft" class="ghost">保存草稿</button>
    <button id="load-draft" class="ghost">读取草稿</button>
    <div class="err" id="form-err"></div>
  </section>

  <section class="card">
    <div style="font-weight:600">结果预览</div>
    <div class="preview" id="preview" role="status" aria-live="polite">正在检查生成任务…</div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-weight:600">任务中心</div>
      <div class="hint" id="q-info"></div>
    </div>
    <div id="tasks-note" class="hint"></div>
    <div class="table-scroll"><table style="margin-top:8px">
      <thead><tr><th>任务</th><th>类型</th><th>状态</th><th>进度</th><th>耗时</th><th>内存峰值</th><th>操作</th></tr></thead>
      <tbody id="tasks"><tr><td colspan="7" class="hint">暂无任务</td></tr></tbody>
    </table></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let assetId = null, draftId = null, models = [];
let taskItems = [], selectedTaskId = null, previewAssetId = null, previewRequest = 0;
let refreshing = false, submitting = false, previewManual = false;
const fmt = (v) => v == null ? '—' : v;
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusNames = {queued:'排队中',loading:'加载模型',running:'生成中',postprocess:'保存产物',succeeded:'已完成',failed:'失败',interrupted:'已中断',canceled:'已取消',cancel_requested:'正在取消'};
const isTestTask = t => t.model_id === 'fake-image';

function previewMessage(title, detail = '', error = false) {
  previewRequest++;
  previewAssetId = null;
  $('preview').replaceChildren();
  const heading = document.createElement('div'); heading.textContent = title;
  const body = document.createElement('div'); body.className = error ? 'err' : 'hint'; body.textContent = detail;
  $('preview').append(heading, body);
}

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, opts);
  const ct = r.headers.get('content-type') || '';
  const body = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body.error && body.error.message) ? `${body.error.code}: ${body.error.message}` : r.status);
  return body;
}

async function refreshStatus() {
  try {
    const h = await api('/health');
    $('h-health').textContent = `服务正常 · 运行 ${h.uptime_s}s · 恢复中断 ${h.recovery.interrupted} 个`;
    const s = await api('/system/status');
    $('h-mem').textContent = `MPS 预算 ${s.memory.budget_mb}MB · 已用 ${fmt(s.memory.mps_alloc_mb)}MB`;
    $('h-model').textContent = `已加载模型：${s.loaded_model || '无'}`;
    $('q-info').textContent = `排队 ${s.queue.queued} · 执行中 ${s.queue.active} · 并发 ${s.concurrency}`;
  } catch (e) { $('h-health').textContent = '服务异常：' + e.message; }
}

async function refreshModels() {
  const r = await api('/models');
  models = r.items.filter(m => m.id !== 'fake-image');
  renderModels();
}

function renderModels() {
  const previous = $('model').value;
  const available = models.filter(m => m.kind === $('kind').value);
  $('model').innerHTML = available.map(m => `<option value="${esc(m.id)}" ${m.downloaded ? '' : 'disabled'}>${esc(m.name)}${m.downloaded ? '' : '（权重未就位）'}</option>`).join('');
  const chosen = available.find(m => m.id === previous && m.downloaded) || available.find(m => m.downloaded);
  $('model').value = chosen ? chosen.id : '';
  $('submit').disabled = submitting || !chosen;
  $('model-hint').textContent = chosen
    ? '权重已就位；提交后仍需加载模型，是否成功以任务结果为准。'
    : '当前类型的模型权重尚未就位，暂时不能生成；页面会自动更新。';
}

async function refreshTasks() {
  const r = await api('/tasks?limit=100');
  taskItems = r.items;
  const realTasks = taskItems.filter(t => !isTestTask(t));
  const testCount = taskItems.length - realTasks.length;
  $('tasks-note').textContent = testCount ? `下方含 ${testCount} 条流程测试记录，均已标注；流程测试不代表真实模型生成。` : '';
  if (!taskItems.length) $('tasks').innerHTML = '<tr><td colspan="7" class="hint">暂无任务</td></tr>';
  else $('tasks').innerHTML = taskItems.map(t => `
    <tr>
      <td class="mono">${esc(t.id.slice(-8))}<div class="hint">${esc(t.model_id)}</div>${isTestTask(t) ? '<div class="hint">流程测试 · 非模型生成</div>' : ''}</td>
      <td>${t.kind === 'image' ? '图片' : '视频'}</td>
      <td><span class="pill s-${esc(t.status)}">${esc(statusNames[t.status] || t.status)}</span>${t.error_message ? `<div class="task-error">${esc(t.error_code || '')}：${esc(t.error_message)}</div>` : ''}</td>
      <td>${Math.round((t.progress || 0) * 100)}%</td>
      <td>${t.latency_ms ? (t.latency_ms / 1000).toFixed(1) + 's' : '—'}</td>
      <td>${t.peak_mem_mb || '—'} MB</td>
      <td>
        ${['queued','running','loading','postprocess'].includes(t.status) ? `<button class="ghost" style="margin:0;padding:3px 6px" data-action="cancel" data-task="${esc(t.id)}">取消</button>` : ''}
        ${['failed','interrupted','canceled'].includes(t.status) ? `<button class="ghost" style="margin:0;padding:3px 6px" data-action="retry" data-task="${esc(t.id)}">从头重试</button>` : ''}
        <button class="ghost" style="margin:2px 0;padding:3px 6px" data-action="view" data-task="${esc(t.id)}">${t.output_asset_id ? '查看结果' : '查看状态'}</button>
      </td>
    </tr>`).join('');
  if (!previewManual && realTasks.length) selectedTaskId = realTasks[0].id;
  const selected = taskItems.find(t => t.id === selectedTaskId);
  if (selected) await renderTaskPreview(selected);
  else if (!previewAssetId) previewMessage('尚无真实生成结果', '提交真实模型任务后，这里会显示进度、失败原因或生成结果。流程测试占位图不计入真实结果。');
}

async function renderTaskPreview(t) {
  if (t.status === 'succeeded' && t.output_asset_id) {
    if (previewAssetId !== t.output_asset_id) await showAsset(t.output_asset_id, t.kind, t);
    return;
  }
  const title = isTestTask(t) ? '流程测试任务（非真实生成）' : `任务${statusNames[t.status] || t.status}`;
  const detail = t.error_message || (t.status === 'succeeded' ? '任务没有返回产物，请检查后端记录。' : '当前还没有可预览的产物。生成完成后将自动显示。');
  previewMessage(title, detail, ['failed','interrupted'].includes(t.status));
}

$('tasks').onclick = async e => {
  const button = e.target.closest('button[data-action]');
  if (!button) return;
  const id = button.dataset.task;
  if (button.dataset.action === 'cancel') return cancelTask(id);
  if (button.dataset.action === 'retry') return retryTask(id);
  previewManual = true; selectedTaskId = id; previewAssetId = null;
  const task = taskItems.find(t => t.id === id);
  if (task) await renderTaskPreview(task);
};

window.cancelTask = async (id) => {
  try { const r = await api(`/tasks/${id}/cancel`, { method: 'POST' });
    alert(r.result === 'cancel_requested' ? `已请求停止（${r.phase}），将在当前步/帧结束后停止` : '已取消'); refreshTasks();
  } catch (e) { alert(e.message); }
};
window.retryTask = async (id) => { try { const r = await api(`/tasks/${id}/retry`, { method: 'POST' }); selectedTaskId = r.task_id; previewManual = true; await refreshTasks(); } catch (e) { alert(e.message); } };
async function showAsset(aid, kind, task) {
  previewMessage('正在加载预览…');
  previewAssetId = aid;
  const request = previewRequest;
  try {
    const a = await api('/assets/' + encodeURIComponent(aid));
    if (request !== previewRequest) return;
    const url = `/api/assets/${encodeURIComponent(aid)}/file`;
    const root = $('preview'); root.replaceChildren();
    const label = document.createElement('div'); label.className = 'hint';
    label.textContent = isTestTask(task) ? '流程测试占位图 · 不代表模型生成结果' : '真实模型生成结果';
    const media = document.createElement(kind === 'video' ? 'video' : 'img');
    if (kind === 'video') { media.controls = true; media.preload = 'metadata'; }
    else media.alt = isTestTask(task) ? '流程测试占位图' : '生成图片';
    const status = document.createElement('div'); status.className = 'hint'; status.textContent = '正在读取媒体文件…';
    const loaded = () => { status.textContent = `${a.width}×${a.height}${kind === 'video' ? ` · ${a.frames || '?'} 帧 · ${a.fps || '?'}fps` : ''} · ${(a.size/1e6).toFixed(2)}MB`; };
    media.addEventListener(kind === 'video' ? 'loadedmetadata' : 'load', loaded);
    media.addEventListener('error', () => { status.className = 'err'; status.textContent = '媒体预览加载失败，请检查素材文件是否存在；可尝试下载原文件。'; });
    const download = document.createElement('a'); download.href = url; download.download = ''; download.textContent = '下载原文件';
    root.append(label, media, status, download); media.src = url;
  } catch (e) {
    if (request === previewRequest) previewMessage('预览加载失败', e.message, true);
  }
}

$('kind').onchange = () => { $('video-opts').style.display = $('kind').value === 'video' ? 'grid' : 'none'; renderModels(); };

$('file').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  try {
    const r = await api('/assets', { method: 'POST', body: fd });
    assetId = r.asset_id;
    $('asset-hint').textContent = `已上传 ${r.width}×${r.height} · ${r.asset_id.slice(-8)}`;
  } catch (err) { $('asset-hint').textContent = '上传失败：' + err.message; }
};

$('submit').onclick = async () => {
  $('form-err').textContent = '';
  const params = {
    prompt: $('prompt').value,
    width: +$('width').value, height: +$('height').value,
    steps: +$('steps').value, seed: +$('seed').value,
  };
  if ($('kind').value === 'video') { params.frames = +$('frames').value; params.fps = +$('fps').value; params.probe_spec = true; }
  try {
    if (!$('model').value) throw new Error('当前没有可用模型，请等待权重就位。');
    if ($('kind').value === 'video' && !assetId) throw new Error('请先上传视频首帧图。');
    submitting = true; $('submit').disabled = true;
    const r = await api('/tasks', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ kind: $('kind').value, model_id: $('model').value, params, input_asset_id: assetId }) });
    selectedTaskId = r.task_id; previewManual = true; previewAssetId = null;
    await refreshTasks();
    $('preview').scrollIntoView({behavior:'smooth',block:'nearest'});
  } catch (e) { $('form-err').textContent = e.message; }
  finally { submitting = false; renderModels(); }
};

$('save-draft').onclick = async () => {
  const content = { prompt: $('prompt').value, width: +$('width').value, height: +$('height').value,
                    steps: +$('steps').value, seed: +$('seed').value, model: $('model').value,
                    assetId, kind: $('kind').value };
  try {
    if (!draftId) { const r = await api('/drafts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: '画布草稿', content }) }); draftId = r.draft_id; }
    else { await api('/drafts/' + draftId, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ content }) }); }
    alert('草稿已保存（本地持久化）');
  } catch (e) { alert('保存失败：' + e.message); }
};

$('load-draft').onclick = async () => {
  try {
    const d = draftId ? await api('/drafts/' + draftId) : null;
    if (!d) { alert('尚无草稿，请先保存'); return; }
    const c = d.content;
    $('prompt').value = c.prompt || ''; $('width').value = c.width; $('height').value = c.height;
    $('steps').value = c.steps; $('seed').value = c.seed; $('kind').value = c.kind || 'image';
    $('kind').onchange();
    if (c.model) $('model').value = c.model;
    assetId = c.assetId || assetId;
    alert(`草稿已恢复（v${d.version}）`);
  } catch (e) { alert(e.message); }
};

async function refreshAll() {
  if (refreshing) return;
  refreshing = true;
  try {
    const results = await Promise.allSettled([refreshModels(), refreshStatus(), refreshTasks()]);
    if (results[0].status === 'rejected') { $('model-hint').textContent = '无法读取模型状态：' + results[0].reason.message; $('submit').disabled = true; }
    if (results[2].status === 'rejected') $('tasks-note').textContent = '任务列表更新失败：' + results[2].reason.message;
  } finally { refreshing = false; }
}
refreshAll();
setInterval(refreshAll, 2000);
</script>
</body>
</html>
