<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>物料间 · 三款前端原型评审</title><style>

kground:#e5ebff;color:#3154c6}.card h2{font-size:18px;font-weight:600;margin:0}.card .note{font-size:11px;color:#838994}.screenshot{margin:0 12px;border:1px solid #e3e7eb;border-radius:9px;overflow:hidden;background:#f0f2f5;cursor:zoom-in;position:relative;padding:0;text-align:left}.screenshot img{display:block;width:100%;aspect-ratio:1.44;object-fit:cover;object-position:top}.screenshot .hint{position:absolute;bottom:10px;right:10px;background:#ffffffed;color:#252a33;font-size:10px;border-radius:5px;padding:3px 8px}.detail{padding:19px 22px 24px;display:flex;flex-direction:column;flex:1}.detail p{font-size:12px;min-height:60px;line-height:1.8}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}.tags span{font-size:10px;background:#f2f4f7;border-radius:5px;color:#717783;padding:3px 7px}.try{border:1px solid #dce0e8;border-radius:9px;background:white;padding:11px;text-align:center;display:block;font-size:12px;margin-top:auto}.try:hover{background:#f4f6f9}.card:first-child .try{background:#222b1b;color:#e5f3d3;border-color:#222b1b}.compare-footer{display:flex;justify-content:space-between;gap:30px;margin-top:32px;font-size:12px;color:#727985}.sources a{text-decoration:underline;text-underline-offset:3px;margin-left:10px}.viewer{display:none;height:calc(100dvh - 74px);flex-direction:column}.viewer-tools{display:flex;gap:20px;align-items:center;padding:12px 24px;border-bottom:1px solid #dce0e8;background:white;flex-wrap:wrap}.viewer-tools p{font-size:12px}.viewer-tools .open{margin-left:auto;font-size:12px;text-decoration:underline;text-underline-offset:3px}iframe{border:0;flex:1;width:100%;background:#fff;min-height:500px}.mobile-note{display:none}@media(max-width:960px){.grid{grid-template-columns:1fr}.card{max-width:720px;width:100%;margin:auto}.detail p{min-height:0}.intro{align-items:start}.recommend{max-width:260px}.compare-footer{flex-direction:column}}@media(max-width:600px){header{height:64px;padding:0 16px;gap:10px}header .label{font-size:10px;padding-left:10px}header small{display:none}main{padding:30px 18px}.intro{display:block}h1{font-size:28px}.recommend{margin-top:22px;max-width:100%}.compare-controls{gap:10px}.toggle button{padding:6px 10px}.compare-footer{font-size:11px}.viewer{height:calc(100dvh - 64px)}.viewer-tools{padding:10px;gap:8px}.viewer-tools p{display:none}.viewer-tools .open{font-size:10px}.mobile-note{display:block;font-size:11px;color:#848a95;margin-bottom:20px}}button:focus-visible,a:focus-visible{outline:2px solid #476fe2;outline-offset:3px}
</style></head><body>
<header><button class="back" id="back">← 返回比较</button><a class="logo" href="index.html">物料间</a><span class="label">FRONTEND DESIGN REVIEW / 01</span><small>三款原型 · 两种主题 · 同一套创作流程</small></header>
<main id="gallery"><div class="intro"><div><div class="eyebrow">FIND YOUR CREATIVE SPACE</div><h1>选一种，更顺手的创作方式。</h1><p>看布局，也点一点流程。每一款都包含深色和浅色模式。</p></div><div class="recommend"><b>推荐：A 的导演台 + C 的项目首页</b>A 更贴近你描述的助手与画布并列；C 的项目入口便于找回作品。也可以组合你喜欢的部分。</div></div>
<div class="compare-controls"><span>同时比较</span><div class="toggle" id="compare-view"><button data-view="director" class="active">导演台</button><button data-view="home">项目首页</button><button data-view="workbench">快捷工作台</button></div><div class="toggle" id="compare-theme"><button data-theme="light">浅色</button><button data-theme="dark" class="active">深色</button></div></div><p class="mobile-note">建议在电脑上比较画布布局；手机也可以逐步体验。</p>
<div class="grid" id="cards"></div><div class="compare-footer"><span>交互原型 · 使用预置素材 · 不调用模型、不产生费用。<br>本轮评审视觉与工作方式；正式接口联调将在选型后继续。</span><div class="sources">设计参考：<a href="https://www.liblib.tv" target="_blank" rel="noreferrer">LIBTV</a><a href="https://app.oiioii.art/zh/" target="_blank" rel="noreferrer">OiiOii</a><a href="https://refero.design/apps/search?order=trending" target="_blank" rel="noreferrer">Refero</a></div></div></main>
<section class="viewer" id="viewer"><div class="viewer-tools"><div class="toggle" id="variant-select"><button data-variant="a">A 画布</button><button data-variant="b">B 向导</button><button data-variant="c">C 工作室</button></div><div class="toggle" id="viewer-view"><button data-view="director">导演台</button><button data-view="home">项目首页</button><button data-view="workbench">快捷工作台</button></div><div class="toggle" id="viewer-theme"><button data-theme="light">浅色</button><button data-theme="dark">深色</button></div><a class="open" id="standalone" target="_blank" rel="noreferrer">单独打开 ↗</a></div><iframe id="preview" title="物料间交互原型"></iframe></section>
<script>
const designs=[{id:'a',file:'a-canvas.html',title:'画布导演台',subtitle:'沉浸创作 / 冷静、专注',desc:'助手在左，当前画面在右。确认一步后，再进入下一步；画布留白给创作内容。',tags:['浮动工作卡','左侧 AI 导演','石墨 / 苔绿']},{id:'b',file:'b-guide.html',title:'轻量向导',subtitle:'一步一件事 / 轻松、友好',desc:'像整理一份创作手记。中心是当前任务，助手在旁边提供帮助，第一次用也容易理解。',tags:['中心任务卡','轻量助手','暖白 / 陶土']},{id:'c',file:'c-studio.html',title:'项目工作室',subtitle:'项目与作品 / 清晰、利落',desc:'从新建与最近项目进入创作。更适合经常制作商品素材、需要找回历史版本的用户。',tags:['项目入口','作品网格','纯白 / 钴蓝']}];
let active='a',theme='dark',view='director',opened=false,lastPreview='';
const $=s=>document.querySelector(s);
function update(){for(const id of ['compare-view','viewer-view'])$('#'+id).querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));for(const id of ['compare-theme','viewer-theme'])$('#'+id).querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme));$('#variant-select').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.variant===active));if(opened){const d=designs.find(d=>d.id===active),url=d.file+'?view='+view+'&theme='+theme;const key=active+'|'+view;const doc=$('#preview').contentDocument;if(lastPreview===key&&doc?.querySelector('[aria-label="切换深浅主题"]')){if(doc.documentElement.dataset.theme!==theme)doc.querySelector('[aria-label="切换深浅主题"]').click();}else{$('#preview').src=url;lastPreview=key;}$('#standalone').href=url;}else{$('#cards').innerHTML=designs.map(d=>`<article class="card"><div class="card-top"><span class="letter ${d.id}">${d.id.toUpperCase()}</span><div><h2>${d.title}</h2><div class="note">${d.subtitle}</div></div></div><button class="screenshot" data-open="${d.id}" aria-label="打开 ${d.id.toUpperCase()} ${d.title}"><img src="screenshots/${d.id}-${view}-${theme}.png" alt="${d.title} ${view==='director'?'导演台':view==='home'?'项目首页':'快捷工作台'} ${theme==='dark'?'深色':'浅色'}原型"><span class="hint">点击体验 ↗</span></button><div class="detail"><p>${d.desc}</p><div class="tags">${d.tags.map(t=>`<span>${t}</span>`).join('')}</div><button class="try" data-open="${d.id}">体验方案 ${d.id.toUpperCase()} →</button></div></article>`).join('');}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;update();}if(b.dataset.theme){theme=b.dataset.theme;update();}if(b.dataset.variant){active=b.dataset.variant;update();}if(b.dataset.open){active=b.dataset.open;opened=true;$('#gallery').style.display='none';$('#viewer').style.display='flex';$('#back').style.display='block';window.scrollTo(0,0);update();}});
$('#back').onclick=()=>{opened=false;lastPreview='';$('#gallery').style.display='block';$('#viewer').style.display='none';$('#back').style.display='none';$('#preview').removeAttribute('src');update();};
update();
</script></body></html>
